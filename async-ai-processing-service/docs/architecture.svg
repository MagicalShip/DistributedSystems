<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c24141"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172554; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .edge-text { font: 600 13px Arial, sans-serif; fill: #334155; }
      .edge-red { font: 600 13px Arial, sans-serif; fill: #b91c1c; }
      .box { stroke-width: 2; rx: 14; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #334155; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .edge-failure { fill: none; stroke: #c24141; stroke-width: 2.5; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Asynchronous AI Processing Architecture</text>
  <text x="600" y="75" text-anchor="middle" class="subtitle">RabbitMQ provides durable messaging, bounded retries, and dead-letter isolation</text>

  <rect x="40" y="155" width="160" height="110" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="120" y="195" text-anchor="middle" class="node-title">Client</text>
  <text x="120" y="223" text-anchor="middle" class="node-text">API tester / harness</text>

  <rect x="270" y="135" width="210" height="150" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="375" y="175" text-anchor="middle" class="node-title">Producer Service</text>
  <text x="375" y="203" text-anchor="middle" class="node-text">FastAPI - port 8080</text>
  <text x="375" y="228" text-anchor="middle" class="node-text">POST /process</text>
  <text x="375" y="251" text-anchor="middle" class="node-text">GET /result/{id}</text>

  <rect x="560" y="145" width="190" height="130" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="655" y="185" text-anchor="middle" class="node-title">RabbitMQ</text>
  <text x="655" y="215" text-anchor="middle" class="node-text">task_queue</text>
  <text x="655" y="240" text-anchor="middle" class="node-text">durable + persistent</text>

  <rect x="830" y="135" width="190" height="150" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="925" y="175" text-anchor="middle" class="node-title">AI Consumer</text>
  <text x="925" y="203" text-anchor="middle" class="node-text">manual ACK</text>
  <text x="925" y="228" text-anchor="middle" class="node-text">prefetch = 1</text>
  <text x="925" y="251" text-anchor="middle" class="node-text">max retries = 3</text>

  <rect x="1045" y="155" width="125" height="110" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1107" y="195" text-anchor="middle" class="node-title">Ollama</text>
  <text x="1107" y="222" text-anchor="middle" class="node-text">llama3.2:1b</text>
  <text x="1107" y="245" text-anchor="middle" class="node-text">port 11434</text>

  <rect x="310" y="430" width="240" height="125" class="box" fill="#ecfeff" stroke="#0891b2"/>
  <text x="430" y="470" text-anchor="middle" class="node-title">Results Store</text>
  <text x="430" y="500" text-anchor="middle" class="node-text">JSON files by request ID</text>
  <text x="430" y="526" text-anchor="middle" class="node-text">processing / completed / error</text>

  <rect x="625" y="405" width="210" height="100" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="730" y="445" text-anchor="middle" class="node-title">Dead-letter Exchange</text>
  <text x="730" y="474" text-anchor="middle" class="node-text">dead_letter_exchange</text>

  <rect x="625" y="570" width="210" height="100" class="box" fill="#fecaca" stroke="#b91c1c"/>
  <text x="730" y="610" text-anchor="middle" class="node-title">Dead-letter Queue</text>
  <text x="730" y="639" text-anchor="middle" class="node-text">dead_letter_queue</text>

  <path d="M 200 190 L 270 190" class="edge"/>
  <text x="235" y="176" text-anchor="middle" class="edge-text">POST text</text>

  <path d="M 270 245 L 200 245" class="edge-dashed"/>
  <text x="235" y="276" text-anchor="middle" class="edge-text">ID immediately</text>

  <path d="M 480 210 L 560 210" class="edge"/>
  <text x="520" y="194" text-anchor="middle" class="edge-text">publish</text>

  <path d="M 750 210 L 830 210" class="edge"/>
  <text x="790" y="194" text-anchor="middle" class="edge-text">deliver</text>

  <path d="M 1020 195 L 1045 195" class="edge"/>
  <text x="1032" y="180" text-anchor="middle" class="edge-text">prompt</text>

  <path d="M 1045 245 L 1020 245" class="edge-dashed"/>
  <text x="1032" y="273" text-anchor="middle" class="edge-text">response</text>

  <path d="M 375 285 L 405 430" class="edge"/>
  <text x="350" y="360" text-anchor="middle" class="edge-text">write/read status</text>

  <path d="M 900 285 C 820 355, 640 400, 550 475" class="edge"/>
  <text x="735" y="370" text-anchor="middle" class="edge-text">save result before ACK</text>

  <path d="M 900 135 C 860 82, 700 82, 655 145" class="edge-dashed"/>
  <text x="782" y="105" text-anchor="middle" class="edge-text">retry with retry_count + 1</text>

  <path d="M 690 275 L 720 405" class="edge-failure"/>
  <text x="765" y="338" text-anchor="middle" class="edge-red">final NACK</text>

  <path d="M 730 505 L 730 570" class="edge-failure"/>
  <text x="815" y="543" text-anchor="middle" class="edge-red">route dead letter</text>

  <rect x="40" y="625" width="440" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="65" y1="645" x2="110" y2="645" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="125" y="650" class="node-text">normal flow</text>
  <line x1="245" y1="645" x2="290" y2="645" stroke="#334155" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="305" y="650" class="node-text">response / retry</text>
  <line x1="65" y1="670" x2="110" y2="670" stroke="#c24141" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="125" y="675" class="node-text">permanent failure path</text>
</svg>
